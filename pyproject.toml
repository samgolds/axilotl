[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axilotl"
version = "0.1.0"
description = "Halo-model code for CMB dark-screening angular power spectra (axion/dark-photon conversion)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.0",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "hmvec @ git+https://github.com/msyriac/hmvec.git",
]

[tool.setuptools]
packages = ["axilotl"]
